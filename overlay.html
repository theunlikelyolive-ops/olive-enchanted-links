<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Olive Stream Links Overlay</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden}
body{font-family:Georgia,"Times New Roman",serif;color:#fff8ff}
.card{width:440px;padding:16px;border:1px solid #f0d8ff;border-radius:22px;background:linear-gradient(135deg,rgba(35,18,53,.94),rgba(87,43,117,.91));box-shadow:0 8px 28px rgba(14,5,25,.45),inset 0 1px rgba(255,255,255,.25);backdrop-filter:blur(8px)}
.header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.logo{width:58px;height:58px;object-fit:cover;border-radius:50%;border:2px solid #f7eaff;box-shadow:0 0 12px #d99aff}
h1{font-size:23px;margin:0;color:#f5ddff;text-shadow:0 0 12px #d28cff}
p{margin:3px 0 0;font:12px Arial,sans-serif;color:#e8d5f4}
.links{display:grid;grid-template-columns:1fr 1fr;gap:9px}
a{display:flex;align-items:center;gap:8px;padding:10px 11px;border-radius:12px;text-decoration:none;color:#fff;background:linear-gradient(110deg,#8956a9,#55306f);border:1px solid #e7c9f5;font: bold 13px Arial,sans-serif;box-shadow:inset 0 1px #ffffff33}
a:hover{filter:brightness(1.2)}
.icon{width:23px;height:23px;border-radius:50%;display:grid;place-items:center;background:#f6e8ff;color:#51266d;font-size:13px;flex:0 0 23px}
</style>
</head>
<body>
<div class="card">
  <div class="header"><img class="logo" src="assets/olive-logo.png" alt=""><div><h1>Olive's Little Corner</h1><p>Find me around the internet ✨</p></div></div>
  <div class="links">
    <a href="https://www.twitch.tv/oliveoakwren" target="_blank"><span class="icon">T</span>Twitch</a>
    <a href="https://www.tiktok.com/@olive_oak_wren" target="_blank"><span class="icon">♪</span>TikTok</a>
    <a href="https://discord.gg/ghk3QMKpS" target="_blank"><span class="icon">☾</span>Discord</a>
    <a href="https://www.teepublic.com/lic/3a-a_sdt3qQ" target="_blank"><span class="icon">✦</span>Shop</a>
  </div>
</div>
</body>
</html>
